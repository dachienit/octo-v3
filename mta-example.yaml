_schema-version: "3.3.0"
ID: mirati
version: 1.0.0
description: Mirati AI Agent Core Service + Approuter on SAP BTP Cloud Foundry

parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo

# Build project
build-parameters:
  before-all:
    - builder: custom
      timeout: 30m
      commands:
        - npm ci
        - npm run build --workspace=core-agent
        - npm run build --workspace=core-service
        - npm run build --workspace=web-ui-corp
        - npm run build --workspace=web-app-corp

modules:
  # ----------------------------------------------------------------------------
  # Backend: core-service (HTTP/SSE). Tools run with --sandbox=host inside this
  # container. $PORT is injected by Cloud Foundry.
  # ----------------------------------------------------------------------------
  - name: mirati-srv
    type: nodejs
    path: core-service
    parameters:
      buildpack: nodejs_buildpack
      command: node dist/main.js --http $PORT workspace
      memory: 16384M
      disk-quota: 10239M
    properties:
      # Skip login logout UI      
      MIRATI_STUDIO_EDGE_AUTH: xsuaa
      CORE_SERVICE_HIDE_AUTH_UI: "true"
      CORE_SERVICE_ALLOW_SIGNUP: "false"
      NODE_ENV: production
      
      # To disable postgresql-db if not available in BTP subaccount
      CORE_SERVICE_AUTH_ALLOW_EPHEMERAL: "true"
      # Data-root durability via the objectstore-service HTTP gateway (restore at boot,
      # snapshot on SIGTERM + workspace refresh). Keys: <prefix><path-relative-to-dataRoot>.
      # The prefix must match the scope bound to the gateway API key. The key itself is
      # NEVER committed — set it once after deploy:
      #   cf set-env mirati-srv CORE_SERVICE_OBJECTSTORE_GATEWAY_API_KEY <osk_...> && cf restage mirati-srv
      # ALLOW_EPHEMERAL=true for first rollout; flip to "false" once the smoke test passes.
      # SINGLE-WRITER: do NOT scale mirati-srv instances > 1 while the mirror is active —
      # concurrent snapshots would overwrite each other and delete-sync from one instance
      # could wipe another instance's fresh writes.
      CORE_SERVICE_OBJECTSTORE_GATEWAY_API_KEY: ""
      CORE_SERVICE_OBJECTSTORE_ALLOW_EPHEMERAL: "true"
      CORE_SERVICE_OBJECTSTORE_GATEWAY_URL: ""
      CORE_SERVICE_OBJECTSTORE_PREFIX: ""

      CORE_SERVICE_AGENT_WORKERS_ENABLED: "false"
      CORE_SERVICE_REMINDERS_ENABLED: "false"
      CORE_SERVICE_CONNECTION_ENABLED: "false"
      # Optional allowlist of LLM providers shown in the UI picker (comma-separated ids). Unset = all.
      # Ids: bosch-genai, openai-codex, openai, google, anthropic, sap-openai, sap-claude
      CORE_SERVICE_LLM_PROVIDERS: "bosch-genai"
      # Optional browser tab title for the web app. Unset = keep the index.html default ("Octo Web App").
      CORE_SERVICE_APP_TITLE: "mirati Studio"
    provides:
      - name: mirati-srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: mirati-xsuaa
      #- name: mirati-postgresql
      - name: mirati-destination
      - name: mirati-connectivity
      - name: mirati-secrets
    # Assemble a self-contained deploy/ folder: vendors @mirati/core-agent as an
    # npm-pack tarball (file: dep) so the CF buildpack's node_modules relocation
    # does not break workspace resolution. before-all has already built all dist.
    build-parameters:
      builder: custom
      commands:
        - node scripts/assemble-deploy.mjs
      build-result: deploy
      ignore:
        - "node_modules/"

  # ----------------------------------------------------------------------------
  # Approuter: XSUAA login gate, static SPA host, reverse proxy to mirati-srv.
  # The SPA build is copied into approuter/resources at build time.
  # ----------------------------------------------------------------------------
  - name: mirati
    type: approuter.nodejs
    path: approuter
    parameters:
      memory: 2048M
      disk-quota: 8192M
    requires:
      - name: mirati-xsuaa
      # IYH1HC SAP connection add — destination + connectivity so the approuter's
      # ADT smart-proxy (start.js / lib/adt-proxy.js) can resolve on-prem
      # destinations and tunnel via the connectivity proxy with principal propagation.
      - name: mirati-destination
      - name: mirati-connectivity
      - name: mirati-srv-api
        group: destinations
        properties:
          name: mirati-srv
          url: ~{srv-url}
          forwardAuthToken: true
    build-parameters:
      builder: custom
      # Cross-platform copy of the built SPA into approuter/resources. Node is used
      # instead of rm/cp/mkdir so the build works on Windows (mbt) and Linux CI alike.
      commands:
        - node -e "const fs=require('fs');fs.rmSync('resources',{recursive:true,force:true});fs.cpSync('../web-app-corp/dist','resources',{recursive:true})"
      ignore:
        - "node_modules/"

resources:
  - name: mirati-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json

  # Durable user DB. The CF container filesystem is ephemeral, so the
  # auth store (users/tokens/federated identities/provider keys) must live in a
  # bound PostgreSQL service. core-service auto-selects PostgreSQL when this
  # binding is present (see auth-storage.ts detectPostgres); falls back to SQLite
  # locally. Plan confirmed via `cf marketplace -e postgresql-db` (this landscape
  # only offers "standard").
  #- name: mirati-postgresql
  #  type: org.cloudfoundry.managed-service
  #  parameters:
  #    service: postgresql-db
  #    service-plan: standard

  # Destination + connectivity for on-prem SAP reach via principal propagation.
  - name: mirati-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite

  - name: mirati-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite

  # Secrets. DO NOT commit real values: override via an mtaext at deploy time
  # (cf deploy mirati_*.mtar -e secrets.mtaext) or set after deploy with
  # `cf update-user-provided-service`.
  - name: mirati-secrets
    type: org.cloudfoundry.user-provided-service
    parameters:
      config:
        CORE_SERVICE_ENCRYPTION_KEY: "mirati-75c7e8b8ca58483bbbe94d96ed7e9ac2"
        SSO_GITHUB_CLIENT_SECRET: ""
        AICORE_SERVICE_KEY: ""